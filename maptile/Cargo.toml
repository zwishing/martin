[package]
name = "maptile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "High-performance Thrift RPC microservice for vector tile serving"

[[bin]]
name = "maptile"
path = "src/main.rs"

[lib]
name = "maptile"
path = "src/lib.rs"

[dependencies]
# Martin crates (direct dependency)
martin-core = { workspace = true, features = ["postgres"] }
martin-tile-utils.workspace = true

# Volo Thrift framework
volo-thrift = "0.10"
volo = "0.10"
pilota = "0.11"

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }
futures.workspace = true
async-trait.workspace = true

# Database
deadpool-postgres.workspace = true
postgres = { workspace = true }

# Configuration
serde = { workspace = true }
serde_yaml.workspace = true
serde_json.workspace = true

# CLI and logging
clap = { workspace = true }
log.workspace = true
env_logger.workspace = true
thiserror.workspace = true
anyhow.workspace = true
rustls.workspace = true

# Utilities
tilejson.workspace = true

[build-dependencies]
volo-build = "0.10"

[lints]
workspace = true
